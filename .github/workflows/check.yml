# Checks tick.py, tick.yml and windows.json on every change and every Monday (test_tick.py: fake site answers, no
# network): two events at once, ten at once, midnight, the clock-change days, no timetable, site down with and
# without the fallback, the keep-alive, and that no secret but the dispatch key is used.
name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "23 22 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_tick.py
