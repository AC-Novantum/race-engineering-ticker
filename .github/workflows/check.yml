# Checks windows.json on every change and every Monday: red when the file is malformed or every day in it is past
# (so an event that is coming up with no days set shows as a failed check, not as a silent ticker).
name: check
on:
  push:
  pull_request:
  schedule:
    - cron: "23 22 * * 0"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 test_tick.py
